<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DailyHub · Modération</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5efc'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>D</text></svg>">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .mod { max-width: 460px; margin: 12vh auto 0; padding: 0 16px; }
    .mod .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; box-shadow: var(--shadow); text-align: center;
    }
    .mod h1 { font-size: 20px; margin: 0 0 8px; }
    .mod p { margin: 0 0 16px; color: var(--muted); }
    .mod .game { font-size: 18px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
    .mod .game-url { word-break: break-all; font-size: 13px; }
    .mod button {
      font: inherit; font-weight: 600; border: none; border-radius: 10px;
      padding: 12px 28px; color: #fff; cursor: pointer; margin-top: 8px;
    }
    .mod button.approve { background: var(--ok); }
    .mod button.deny { background: var(--err); }
    .mod button:disabled { opacity: .6; cursor: default; }
    .mod .back { display: inline-block; margin-top: 16px; color: var(--accent); }
  </style>
</head>
<body>
  <main class="mod">
    <div class="brand" style="justify-content:center;margin-bottom:20px">
      <span class="logo">D</span>
      <h1 style="margin:0">DailyHub</h1>
    </div>
    <div class="panel" id="panel">
      <p>Chargement…</p>
    </div>
  </main>

  <script src="config.js?v=2"></script>
  <script>
  (() => {
    "use strict";
    const endpoint = window.DAILYHUB_CONFIG.supabaseUrl + "/functions/v1/moderate";
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const action = params.get("action");
    const sig = params.get("sig");
    const panel = document.getElementById("panel");
    const isApprove = action === "approve";

    const el = (tag, props = {}, text) => {
      const node = Object.assign(document.createElement(tag), props);
      if (text != null) node.textContent = text;
      return node;
    };
    const home = () => el("a", { className: "back", href: "./" }, "Retour à DailyHub");

    function show(title, message, extra = []) {
      panel.replaceChildren(el("h1", {}, title), el("p", {}, message), ...extra);
    }

    function gameBlock(game) {
      const wrap = el("div", { style: "margin-bottom:16px" });
      wrap.append(el("div", { className: "game" }, game.name));
      const link = el("a", { className: "game-url", href: game.url, target: "_blank", rel: "noopener noreferrer" }, game.url);
      wrap.append(link);
      return wrap;
    }

    async function call(extra) {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, action, sig, ...extra }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 403) throw new Error("invalid");
      if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
      return data;
    }

    async function confirm(button) {
      button.disabled = true;
      try {
        const { result, game } = await call({});
        const name = game ? `« ${game.name} »` : "Ce jeu";
        if (result === "approved") show("Accepté ✓", `${name} est maintenant visible par tout le monde.`, [home()]);
        else if (result === "denied") show("Refusé", `${name} a été supprimé des propositions.`, [home()]);
        else if (result === "already_approved") show("Déjà accepté", `${name} est déjà dans le catalogue.`, [home()]);
        else show("Déjà traité", "Cette proposition n'existe plus.", [home()]);
      } catch (err) {
        console.error(err);
        button.disabled = false;
        show("Erreur", "L'action a échoué. Réessaie dans un instant.", [button]);
      }
    }

    async function init() {
      if (!id || !sig || (action !== "approve" && action !== "deny")) {
        return show("Lien invalide", "Ce lien de modération est incomplet.", [home()]);
      }
      try {
        const { game } = await call({ check: true });
        if (!game) return show("Déjà traité", "Cette proposition n'existe plus (déjà refusée ?).", [home()]);
        if (game.status !== "pending") return show("Déjà accepté", `« ${game.name} » est déjà dans le catalogue.`, [gameBlock(game), home()]);

        const button = el("button", { className: isApprove ? "approve" : "deny", type: "button" },
          isApprove ? "Confirmer l'ajout" : "Confirmer le refus");
        button.addEventListener("click", () => confirm(button));
        show(isApprove ? "Accepter ce jeu ?" : "Refuser ce jeu ?",
          isApprove ? "Il sera visible par tous les utilisateurs." : "La proposition sera supprimée.",
          [gameBlock(game), button]);
      } catch (err) {
        console.error(err);
        show(err.message === "invalid" ? "Lien invalide" : "Erreur",
          err.message === "invalid" ? "La signature de ce lien n'est pas valide." : "Impossible de charger la proposition.",
          [home()]);
      }
    }

    init();
  })();
  </script>
</body>
</html>
